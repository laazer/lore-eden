name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates-tests:
    name: gates tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor and earns its place: it has no tomllib, which is
        # why the gate config is JSON. Testing only on a modern interpreter is
        # how that constraint gets broken without anyone noticing.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gates/package-lock.json

      - name: Install the TypeScript gate's parser
        working-directory: gates
        run: npm ci

      # The two diff filters drive these. Absent, they refuse rather than
      # reporting no growth — correct, but it makes the job useless, so CI
      # installs them rather than exercising the refusal path forever.
      - name: Install the linters the diff filters drive
        run: python -m pip install --upgrade pip ruff pylint

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run the gate test suite
        working-directory: gates
        run: python -m pytest -q

  python-tests:
    name: python tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same floor as the gates. The package is a library: a host on 3.10
        # must be able to install it.
        python: ["3.10", "3.12"]

    # The store conformance suite runs against Postgres as well as SQLite. The
    # SQL implementation was written against SQLite and loremaker runs Postgres,
    # so "portable" was an assumption until something ran it on both.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lore-eden
          POSTGRES_DB: lore_eden_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and its test dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        working-directory: python
        env:
          LORE_EDEN_TEST_POSTGRES_DSN: postgresql+psycopg://postgres:lore-eden@localhost:5432/lore_eden_test
          # Without this the Postgres pass skips when the DSN is missing, and a
          # portability claim proven by a skipped test is not proven. Set here
          # so a broken service container fails the job instead of quietly
          # halving what it covers.
          LORE_EDEN_REQUIRE_POSTGRES: "1"
        run: python -m pytest -q

  # Consumes this repo's own reusable workflow. Dogfooding rather than
  # illustration: a reusable workflow nothing calls is a template nobody has
  # checked, and the failure mode of a broken one is a caller that cannot run
  # at all.
  ui-tests:
    name: ui tests
    uses: ./.github/workflows/reusable-node.yml
    with:
      working-directory: ts

  self-check:
    name: gates grade this repo
    runs-on: ubuntu-latest
    steps:
      # Full history: the branch scope diffs against origin/main, and a shallow
      # clone has neither the merge base nor the remote ref to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gates/package-lock.json

      - name: Install the TypeScript gate's parser
        working-directory: gates
        run: npm ci

      # The two diff filters drive these. Absent, they refuse rather than
      # reporting no growth — correct, but it makes the job useless, so CI
      # installs them rather than exercising the refusal path forever.
      - name: Install the linters the diff filters drive
        run: python -m pip install --upgrade pip ruff pylint

      # Positive control, and it runs FIRST. Every gate below can legitimately
      # examine zero files — a docs-only PR gives the TypeScript gate nothing —
      # so a green job proves the gates ran only if something in it is known to
      # fail when they work. Without this the job reported success on its first
      # execution having examined nothing at all, which is the precise failure
      # this library exists to remove.
      - name: Positive control — a planted violation must fail the gate
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          gates="$PWD/gates/lore_eden_gates"
          # A throwaway repo, not a bare temp file. The gates are diff-scoped
          # against the repository they resolve, so a file outside that repo has
          # no touched lines and is graded not at all — while still being counted
          # in "examined N file(s)". The first version of this control did that
          # and passed a violation it should have caught.
          control="$(mktemp -d)/repo"
          mkdir -p "$control"
          git -C "$control" init -q -b main
          cat > "$control/planted.py" <<'PY'
          import json


          def load(raw):
              try:
                  return json.loads(raw)
              except Exception:
                  return None
          PY
          git -C "$control" add -A
          git -C "$control" commit -qm baseline
          # Re-plant as an untracked change so worktree scope has lines to grade.
          rm "$control/planted.py"
          git -C "$control" commit -aqm "remove baseline"
          cat > "$control/planted.py" <<'PY'
          import json


          def load(raw):
              try:
                  return json.loads(raw)
              except Exception:
                  return None
          PY
          if python3 "$gates/py_silent_except_check.py" --repo "$control" --scope worktree; then
            echo "::error::the silent-except gate passed a planted violation; it is not working"
            exit 1
          fi
          echo "control failed as required"

      # The dogfood: run the gates from a clone that is not the machine they were
      # written on. This is the shape of check that would have caught the
      # absolute-path bug in the committed lefthook.yml.
      - name: Run every gate against this repo
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Diff against what main was before this push. `worktree` against a
            # just-pushed HEAD is an empty diff, so the job examined nothing and
            # called it a pass.
            base="${{ github.event.before }}"
            case "$base" in
              ""|0000000000000000000000000000000000000000) base="HEAD~1" ;;
            esac
          else
            base="origin/${{ github.event.pull_request.base.ref }}"
          fi
          echo "scope=branch base=$base"
          for gate in \
            py_organization_check.py \
            py_silent_except_check.py \
            py_git_subprocess_check.py \
            py_defensive_normalization_check.py
          do
            echo "--- $gate"
            python3 "gates/lore_eden_gates/$gate" --repo "$PWD" --scope branch --base "$base"
          done
          echo "--- ts_organization_check.cjs"
          node gates/lore_eden_gates/ts_organization_check.cjs --repo "$PWD" --scope branch --base "$base"

      # Positive control for the two diff filters, and it runs before them for
      # the same reason the silent-except control does: they are diff-scoped, so
      # a PR touching no python gives them nothing to grade and the step below
      # exits 0 having run neither filter. That is what happened on the very PR
      # that added them.
      - name: Positive control — a complexity increase must fail the filter
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          control="$(mktemp -d)/repo"
          mkdir -p "$control"
          git -C "$control" init -q -b main
          # A baseline the filter compares against: one branch, trivially simple.
          cat > "$control/grew.py" <<'PY'
          def classify(n):
              return "big" if n > 10 else "small"
          PY
          git -C "$control" add -A
          git -C "$control" commit -qm baseline
          # The same function, now over the C901 threshold. Only the *growth*
          # should fail it — a pre-existing complex function must not.
          cat > "$control/grew.py" <<'PY'
          def classify(n):
              if n == 1: return "a"
              elif n == 2: return "b"
              elif n == 3: return "c"
              elif n == 4: return "d"
              elif n == 5: return "e"
              elif n == 6: return "f"
              elif n == 7: return "g"
              elif n == 8: return "h"
              elif n == 9: return "i"
              elif n == 10: return "j"
              elif n == 11: return "k"
              elif n == 12: return "l"
              return "z"
          PY
          git -C "$control" add -A
          if (cd "$control" && python3 "$GITHUB_WORKSPACE/gates/lore_eden_gates/ruff_complexity_diff_filter.py" grew.py); then
            echo "::error::the complexity filter passed a function whose complexity grew; it is not working"
            exit 1
          fi
          echo "control failed as required"

      # Separate step: the diff filters take positional, project-relative paths
      # rather than --repo/--scope, so they cannot join the loop above. The
      # asymmetry is theirs; a test asserts both are named here so neither can
      # be added to MANAGED_GATES and forgotten in CI again.
      - name: Run the diff filters against this repo's python
        run: |
          set -euo pipefail
          changed="$(git diff --name-only --diff-filter=ACM HEAD~1 -- 'python/**/*.py' || true)"
          if [ -z "$changed" ]; then
            echo "no python changed; the filters are diff-scoped and would grade nothing"
            exit 0
          fi
          rel="$(echo "$changed" | sed 's|^python/||')"
          echo "$rel"
          cd python
          # shellcheck disable=SC2086
          python3 ../gates/lore_eden_gates/ruff_complexity_diff_filter.py --repo-prefix python $rel
          # shellcheck disable=SC2086
          python3 ../gates/lore_eden_gates/pylint_diff_filter.py --repo-prefix python $rel

      - name: Managed hook block is current
        run: gates/scripts/install-workspace-hooks.sh --check "$PWD"

      # Positive control first, for the reason every control in this job runs
      # first: ruff exits 0 both when the tree is clean and when it was pointed
      # at nothing, and those look identical in a log.
      - name: Positive control — a planted violation must fail the policy
        run: |
          set -euo pipefail
          control="$(mktemp -d)"
          cat > "$control/planted.py" <<'PY'
          from typing import Optional


          def load(raw: str) -> Optional[str]:
              return raw
          PY
          if ruff check --config policy/ruff-base.toml "$control/planted.py"; then
            echo "::error::the ruff policy passed a planted UP045 violation; it is not being applied"
            exit 1
          fi
          echo "control failed as required"

      # The tree, whole, under the policy it publishes. Not diff-scoped: the six
      # gates above are, because a whole-file check on pre-existing hits fails
      # every unrelated edit — but lor-extract-lore-45 and -47 cleaned this tree,
      # so a whole-tree run passes today and can only fail on something new.
      - name: This repo under the ruff policy it publishes
        run: ruff check --config policy/ruff-base.toml gates python

  # An editable install is exercised by every job above; a distributable is not
  # exercised by any of them, and until this existed none had ever been built.
  # The failure mode is quiet: metadata a consumer reads goes missing without
  # anything erroring — `license-files = ["../LICENSE"]` was accepted by
  # setuptools and shipped no licence at all.
  package:
    name: the wheel builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor. A wheel that only builds on a modern interpreter is a
          # wheel the declared requires-python is lying about.
          python-version: "3.10"

      - name: Build the sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .
          python -m twine check dist/*

      - name: The licence is in the artifact, not only in the metadata
        working-directory: python
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          licences = [n for n in names if "LICENSE" in n.upper()]
          if not licences:
              raise SystemExit(
                  "the wheel declares a licence and ships none — see "
                  "tests/test_packaging.py for why this is checked here"
              )
          print("licence shipped:", licences)
          PY

      # Installed from the artifact into an empty environment, with the source
      # tree deliberately not on the path: importing from `python/` would pass
      # whether the wheel contained the package or not.
      - name: Install the wheel into a clean environment and import it
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet python/dist/*.whl
          cd /tmp
          /tmp/clean/bin/python - <<'PY'
          import importlib.util as util

          import lore_eden.agents
          import lore_eden.cache
          import lore_eden.ledger
          import lore_eden.mcp.protocol
          import lore_eden.usage
          import lore_eden.work_items
          import lore_eden.workflow

          print("core imports: ok")

          # The extras boundary, tested against the artifact rather than the
          # source tree, where the import-graph tests already assert it.
          assert util.find_spec("sqlmodel") is None, "sql extra leaked into the base install"
          try:
              import lore_eden.store.sql
          except ModuleNotFoundError as exc:
              print("store.sql correctly requires the sql extra:", exc.name)
          else:
              raise SystemExit("store.sql imported without the sql extra")
          PY
