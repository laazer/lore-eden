name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates-tests:
    name: gates tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor and earns its place: it has no tomllib, which is
        # why the gate config is JSON. Testing only on a modern interpreter is
        # how that constraint gets broken without anyone noticing.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gates/package-lock.json

      - name: Install the TypeScript gate's parser
        working-directory: gates
        run: npm ci

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run the gate test suite
        working-directory: gates
        run: python -m pytest -q

  python-tests:
    name: python tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same floor as the gates. The package is a library: a host on 3.10
        # must be able to install it.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and its test dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        working-directory: python
        run: python -m pytest -q

  ui-tests:
    name: ui tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install
        working-directory: ts
        run: npm ci

      - name: Typecheck
        working-directory: ts
        run: npm run typecheck

      - name: Run the test suite
        working-directory: ts
        run: npm test

  self-check:
    name: gates grade this repo
    runs-on: ubuntu-latest
    steps:
      # Full history: the branch scope diffs against origin/main, and a shallow
      # clone has neither the merge base nor the remote ref to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gates/package-lock.json

      - name: Install the TypeScript gate's parser
        working-directory: gates
        run: npm ci

      # Positive control, and it runs FIRST. Every gate below can legitimately
      # examine zero files — a docs-only PR gives the TypeScript gate nothing —
      # so a green job proves the gates ran only if something in it is known to
      # fail when they work. Without this the job reported success on its first
      # execution having examined nothing at all, which is the precise failure
      # this library exists to remove.
      - name: Positive control — a planted violation must fail the gate
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          gates="$PWD/gates/lore_eden_gates"
          # A throwaway repo, not a bare temp file. The gates are diff-scoped
          # against the repository they resolve, so a file outside that repo has
          # no touched lines and is graded not at all — while still being counted
          # in "examined N file(s)". The first version of this control did that
          # and passed a violation it should have caught.
          control="$(mktemp -d)/repo"
          mkdir -p "$control"
          git -C "$control" init -q -b main
          cat > "$control/planted.py" <<'PY'
          import json


          def load(raw):
              try:
                  return json.loads(raw)
              except Exception:
                  return None
          PY
          git -C "$control" add -A
          git -C "$control" commit -qm baseline
          # Re-plant as an untracked change so worktree scope has lines to grade.
          rm "$control/planted.py"
          git -C "$control" commit -aqm "remove baseline"
          cat > "$control/planted.py" <<'PY'
          import json


          def load(raw):
              try:
                  return json.loads(raw)
              except Exception:
                  return None
          PY
          if python3 "$gates/py_silent_except_check.py" --repo "$control" --scope worktree; then
            echo "::error::the silent-except gate passed a planted violation; it is not working"
            exit 1
          fi
          echo "control failed as required"

      # The dogfood: run the gates from a clone that is not the machine they were
      # written on. This is the shape of check that would have caught the
      # absolute-path bug in the committed lefthook.yml.
      - name: Run every gate against this repo
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Diff against what main was before this push. `worktree` against a
            # just-pushed HEAD is an empty diff, so the job examined nothing and
            # called it a pass.
            base="${{ github.event.before }}"
            case "$base" in
              ""|0000000000000000000000000000000000000000) base="HEAD~1" ;;
            esac
          else
            base="origin/${{ github.event.pull_request.base.ref }}"
          fi
          echo "scope=branch base=$base"
          for gate in \
            py_organization_check.py \
            py_silent_except_check.py \
            py_git_subprocess_check.py \
            py_defensive_normalization_check.py
          do
            echo "--- $gate"
            python3 "gates/lore_eden_gates/$gate" --repo "$PWD" --scope branch --base "$base"
          done
          echo "--- ts_organization_check.cjs"
          node gates/lore_eden_gates/ts_organization_check.cjs --repo "$PWD" --scope branch --base "$base"

      - name: Managed hook block is current
        run: gates/scripts/install-workspace-hooks.sh --check "$PWD"
