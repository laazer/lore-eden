# Typecheck and test a Node project.
#
#   jobs:
#     frontend:
#       uses: laazer/lore-eden/.github/workflows/reusable-node.yml@main
#       with:
#         working-directory: client

name: Node

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
      node-version:
        type: string
        default: '20'
      install:
        description: Prefer `npm ci` — it fails on a lockfile that drifted, where `npm install` quietly fixes it.
        type: string
        default: 'npm ci'
      typecheck:
        type: string
        default: 'npm run typecheck'
      test:
        type: string
        default: 'npm test'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install }}

      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.typecheck }}

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test }}
