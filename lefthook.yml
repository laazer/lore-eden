# Git hooks for lore-eden.
#
# Install:  lefthook install
#
# The shared gates live in gates/ and are installed into the block below by:
#
#   gates/scripts/install-workspace-hooks.sh "$PWD"
#
# lore-eden grades itself with its own gates — if they cannot be lived with
# here, they should not be installed anywhere else.

pre-commit:
  parallel: true
  commands:

    # Outside the managed block on purpose: install-workspace-hooks.sh rewrites
    # everything between the markers, and this is lore-eden's own check rather
    # than one of the shared gates it installs elsewhere.
    # Outside the managed block, like ruff-policy: this one asks a
    # whole-repository question — is anything looking at each tracked file at
    # all — so it has no glob and no {staged_files}. It reads the index, not
    # the files, and costs milliseconds.
    gate-coverage:
      name: Every tracked file is graded, or says why it is not
      run: python3 gates/lore_eden_gates/gate_coverage_check.py --repo .

    ruff-policy:
      name: Ruff, against the policy this repo publishes
      # The policy file itself is in the glob: tightening a rule can make a
      # clean tree dirty without a single .py changing, and a check that only
      # watches .py would not notice until CI.
      glob: "{*.py,**/*.py,policy/ruff-base.toml}"
      run: bash .lefthook/scripts/ruff-policy.sh
    # >>> lore-eden gate guardrails (managed) >>>
    # Generated by lore-eden's install-workspace-hooks.sh — do not edit by
    # hand; re-run that script to refresh. The rules live in lore-eden.
    lore-eden-py-organization:
      name: Python organization guardrails (lore-eden)
      priority: 1
      glob: "{*.py,**/*.py}"
      run: python3 gates/lore_eden_gates/py_organization_check.py {staged_files}
    lore-eden-py-silent-except:
      name: Python silently-caught exceptions (lore-eden)
      priority: 1
      glob: "{*.py,**/*.py}"
      run: python3 gates/lore_eden_gates/py_silent_except_check.py {staged_files}
    lore-eden-py-git-subprocess:
      name: Python git subprocess routing (lore-eden)
      priority: 1
      glob: "{*.py,**/*.py}"
      run: python3 gates/lore_eden_gates/py_git_subprocess_check.py {staged_files}
    lore-eden-py-defensive-normalization:
      name: Python defensive normalization (lore-eden)
      priority: 1
      glob: "{*.py,**/*.py}"
      run: python3 gates/lore_eden_gates/py_defensive_normalization_check.py {staged_files}
    lore-eden-ts-organization:
      name: TypeScript organization guardrails (lore-eden)
      priority: 1
      glob: "{*.ts,*.tsx,**/*.ts,**/*.tsx}"
      run: node gates/lore_eden_gates/ts_organization_check.cjs {staged_files}
    lore-eden-css-organization:
      name: CSS organization guardrails (lore-eden)
      priority: 1
      glob: "{*.css,**/*.css}"
      run: python3 gates/lore_eden_gates/css_organization_check.py {staged_files}
    lore-eden-sh-shellcheck:
      name: Shell script analysis (shellcheck) (lore-eden)
      priority: 1
      glob: "{*.sh,**/*.sh}"
      run: python3 gates/lore_eden_gates/sh_shellcheck_check.py {staged_files}
    lore-eden-data-formats:
      name: Configuration and lockfiles parse (lore-eden)
      priority: 1
      glob: "{*.json,*.yml,*.yaml,*.toml,**/*.json,**/*.yml,**/*.yaml,**/*.toml}"
      run: python3 gates/lore_eden_gates/data_format_check.py {staged_files}
    lore-eden-py-complexity:
      name: Python complexity growth (Ruff C901, diff-scoped) (lore-eden)
      priority: 1
      glob: "{*.py,**/*.py}"
      run: python3 gates/lore_eden_gates/ruff_complexity_diff_filter.py {staged_files}
    lore-eden-py-statements:
      name: Python statement growth (Pylint, diff-scoped) (lore-eden)
      priority: 1
      glob: "{*.py,**/*.py}"
      run: python3 gates/lore_eden_gates/pylint_diff_filter.py {staged_files}
    # <<< lore-eden gate guardrails (managed) <<<

# Sequential on purpose: both commands drive pytest, and two suites competing for
# the same cores is slower than running them in turn — and a pre-push people wait
# for is the only kind that stays installed.
pre-push:
  parallel: false
  commands:
    python-tests:
      name: Python tests (only those the pushed commits can reach)
      glob: "python/**/*.py"
      run: bash .lefthook/scripts/python-tests.sh
    gates-tests:
      name: Gate library tests (whole suite)
      glob: "gates/**/*.py"
      run: bash .lefthook/scripts/gates-tests.sh
