# Git hooks for lore-eden.
#
# Install:  lefthook install
#
# The organization and silent-exception gates are shared with loregarden and are
# installed into the block below by:
#
#   loregarden/scripts/install-workspace-hooks.sh /Users/jacobbrandt/workspace/lore-eden
#
# That block references loregarden's copy of the scripts by absolute path rather
# than vendoring them, so the rules stay one thing across workspaces.

pre-commit:
  parallel: true
  commands:
    # >>> loregarden organization guardrails (managed) >>>
    # Generated by loregarden's scripts/install-workspace-hooks.sh — do not edit
    # by hand; re-run that script to refresh. The rules live in loregarden.
    loregarden-py-organization:
      name: Python organization guardrails (loregarden)
      priority: 1
      glob: "{*.py,**/*.py}"
      run: python3 /Users/jacobbrandt/workspace/loregarden/.lefthook/scripts/py_organization_check.py {staged_files}
    loregarden-py-silent-except:
      name: Python silently-caught exceptions (loregarden)
      priority: 1
      glob: "{*.py,**/*.py}"
      run: python3 /Users/jacobbrandt/workspace/loregarden/.lefthook/scripts/py_silent_except_check.py {staged_files}
    loregarden-ts-organization:
      name: TypeScript organization guardrails (loregarden)
      priority: 1
      glob: "{*.ts,*.tsx,**/*.ts,**/*.tsx}"
      run: node /Users/jacobbrandt/workspace/loregarden/.lefthook/scripts/ts_organization_check.cjs {staged_files}
    # <<< loregarden organization guardrails (managed) <<<
